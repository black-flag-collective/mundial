name: Update match data

# Fetches the latest World Cup 2026 results — from a structured football API
# (primary) with a Claude web-search fallback — and commits data/matches.json
# back to the repo. Committing (rather than
# writing to the server's local disk) is what makes updates PERSIST: Fly
# machines have no volume and reset their filesystem on restart/redeploy, so
# any score written in-process is lost. A commit to main also triggers the
# Fly deploy workflow, so the live site picks up fresh data automatically.

on:
  schedule:
    # Every 30 minutes. Note: GitHub may delay scheduled runs under load, and
    # disables schedules after 60 days of repo inactivity — fine for a
    # tournament-length window.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: update-data
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  update:
    name: Fetch + commit results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify a data source is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No data source configured. Set FOOTBALL_DATA_TOKEN (primary, structured) and/or ANTHROPIC_API_KEY (fallback, web-search) under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run updater
        env:
          # Primary source: a structured football-results API (football-data.org).
          # Reliable and free; no LLM, no hallucinated scores.
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # Fallback source: Claude + web_search, used only when the primary is
          # unavailable. A depleted balance / rate limit is skipped gracefully.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: set the POSTHOG_KEY repo secret to capture the fallback's
          # Claude call in PostHog AI observability. Empty → runs without it.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: node scripts/update-data.js

      # Refresh the bracket projection. project.js only spends an LLM call when the
      # tournament phase has advanced since the last projection (group → R32 → …),
      # so this is cheap on most runs and degrades to a data template without a key.
      - name: Refresh bracket projection
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/project.js

      - name: Commit changes if any
        id: commit
        run: |
          if git diff --quiet -- data/matches.json data/projection.json; then
            echo "No data changes — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "mundial-bot"
          git config user.email "actions@github.com"
          git add data/matches.json data/projection.json
          git commit -m "chore(data): update match results"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The commit above is pushed with the default GITHUB_TOKEN, which by design
      # does NOT trigger other workflows (GitHub blocks this to avoid recursive
      # runs). That means the separate "Deploy to Fly.io" workflow (on: push) never
      # fires for bot data commits, so fresh scores would sit in the repo but never
      # reach the running Fly machine. We therefore deploy directly here whenever
      # new data was committed.
      - name: Set up flyctl
        if: steps.commit.outputs.committed == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: steps.commit.outputs.committed == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
