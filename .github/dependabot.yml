version: 2
updates:
  # Server / root app dependencies
  - package-ecosystem: npm
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # One PR for routine minor/patch bumps to keep noise low; majors stay
      # separate so they can be reviewed on their own.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 2026-11-24: major versions are a deliberate, planned choice, not a weekly stuck PR.
      # Security updates are unaffected by this rule.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2026-11-24: @posthog/ai 8.x declares an optional peer on
      # @anthropic-ai/sdk ^0.78, which conflicts with the sdk version used here,
      # so `npm install` fails with ERESOLVE. Revisit when it widens the peer range.
      - dependency-name: "@posthog/ai"
        update-types: ["version-update:semver-major"]
      # 2026-11-24: posthog-node 6 conflicts with the @posthog/ai 7 peer range
      # (ERESOLVE on npm ci). Revisit together with @posthog/ai.
      - dependency-name: "posthog-node"
        update-types: ["version-update:semver-major"]

  # Design-system package (Storybook / Vite / TS toolchain)
  - package-ecosystem: npm
    directory: "/packages/mundial-ui"
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 2026-11-24: major versions are a deliberate, planned choice, not a weekly stuck PR.
      # Security updates are unaffected by this rule.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2026-11-24: TypeScript 7 breaks `vite build` config loading for this
      # package (vite-plugin-dts does not support it yet). Revisit later.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI / deploy / data workflows
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 2026-11-24: major versions are a deliberate, planned choice, not a weekly stuck PR.
      # Security updates are unaffected by this rule.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
