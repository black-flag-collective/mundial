name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke test
        run: npm test

  ui-package:
    name: UI package (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: packages/mundial-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/mundial-ui

      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/mundial-ui

      - name: Build
        run: npm run build
        working-directory: packages/mundial-ui
